[project]
name = "langgraph-adventure"
version = "0.1.0"
description = "AI text adventure engine teaching LangGraph concepts"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic",
    "typer",
    "pydantic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["langgraph-cli[inmem]>=0.1"]
